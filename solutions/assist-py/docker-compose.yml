name: ivanovsky-lab4

services:
  db:
    image: postgres:15
    container_name: ivanovsky-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    volumes:
      - ivanovsky-pgdata:/var/lib/postgresql/data
    networks:
      - ivanovsky-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ivanovsky-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    networks:
      - ivanovsky-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: ivanovsky-assistant
    environment:
      PORT: ${APP_PORT}
      APP_OWNER: ${APP_OWNER}
      APP_SECRET: ${APP_SECRET}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ivanovsky-backend

volumes:
  ivanovsky-pgdata:
    external: true

networks:
  ivanovsky-backend:
    external: true
